# IP-SAKTI Sahayak Configuration
# Technology selections and system-wide settings

# ==========================================
# CORE TECHNOLOGY STACK (Phase 4 - Technology Selection)
# ==========================================
technology:
  # Embedding Models
  embedding:
    primary: "BAAI/bge-m3"                    # Multilingual dense + sparse
    fallback: "jinaai/jina-embeddings-v3"     # Alternative multilingual
    dimensions: 1024
    max_tokens: 8192
    batch_size: 32
  
  # Reranker
  reranker:
    primary: "BAAI/bge-reranker-v2-m3"        # Cross-encoder for reranking
    fallback: "jinaai/jina-reranker-v2-base-multilingual"
    top_k: 100
    batch_size: 16
  
  # LLM (Generation)
  llm:
    primary: "gpt-4o"                          # Primary generation
    fallback: "gpt-4o-mini"                    # Cost-optimized
    temperature: 0.1                           # Low for legal accuracy
    max_tokens: 4096
    top_p: 0.9
  
  # Vector Database
  vector_db:
    type: "qdrant"
    host: "localhost"
    port: 6333
    collection: "ip_sakti_chunks"
    hnsw_config:
      m: 16
      ef_construct: 100
    quantization: "scalar"                     # Scalar quantization for memory
  
  # Lexical Search
  lexical_search:
    type: "elasticsearch"
    host: "localhost"
    port: 9200
    index: "ip_sakti_lexical"
    analyzer: "legal_analyzer"
  
  # Knowledge Graph
  graph_db:
    type: "neo4j"
    host: "localhost"
    port: 7687
    database: "neo4j"
    username: "neo4j"
  
  # Relational Database
  relational_db:
    type: "postgresql"
    host: "localhost"
    port: 5432
    database: "ip_sakti"
    pool_size: 20
  
  # Cache
  cache:
    type: "redis"
    host: "localhost"
    port: 6379
    db: 0
    ttl_default: 3600
  
  # Message Queue
  message_queue:
    type: "redis"
    host: "localhost"
    port: 6379
    db: 1

# ==========================================
# AUTHORITY TIERS (Phase 5 - Source Authority)
# ==========================================
authority:
  tiers:
    TIER_1:
      name: "Primary Legislation"
      weight: 1.0
      examples: ["act", "amendment_act", "ordinance", "constitution", "treaty"]
      binding: true
    TIER_2:
      name: "Subordinate Legislation"
      weight: 0.9
      examples: ["rule", "regulation", "notification", "order"]
      binding: true
    TIER_3:
      name: "Binding Judicial"
      weight: 0.95
      examples: ["supreme_court_judgment", "high_court_judgment"]
      binding: true
    TIER_4:
      name: "Quasi-Judicial/Regulatory"
      weight: 0.7
      examples: ["tribunal_order", "regulatory_decision", "circular"]
      binding: true
    TIER_5:
      name: "Official Guidance"
      weight: 0.5
      examples: ["guideline", "faq", "pharmacopoeia", "formulary", "manual"]
      binding: false
    TIER_6:
      name: "Secondary Sources"
      weight: 0.2
      examples: ["academic_article", "commentary", "blog", "news"]
      binding: false
  
  # Retrieval scoring weights
  retrieval:
    authority_weight: 0.3              # Weight in combined score
    retrieval_weight: 0.7              # Weight for vector/lexical score
    binding_boost: 1.1                 # Boost for binding authorities
    recency_boost_max: 1.02            # Max recency factor

# ==========================================
# SECURITY CONFIGURATION (Phase 6)
# ==========================================
security:
  jwt:
    algorithm: "RS256"
    issuer: "ip-sakti"
    audience: "ip-sakti-api"
    access_token_ttl: 900          # 15 minutes
    refresh_token_ttl: 604800      # 7 days
    key_rotation_days: 90
  
  api_keys:
    hash_algorithm: "sha256"
    default_ttl_days: 365
    max_keys_per_user: 10
  
  mfa:
    methods: ["totp", "webauthn"]
    totp_issuer: "IP-SAKTI Sahayak"
    webauthn_rp_id: "ip-sakti.local"
  
  encryption:
    algorithm: "AES-256-GCM"
    kms_backend: "local"           # local, aws_kms, hashicorp_vault
    key_rotation_days: 90
    data_classification:
      - public
      - internal
      - confidential
      - restricted
  
  rate_limiting:
    tiers:
      free:
        requests_per_minute: 10
        queries_per_hour: 50
        tokens_per_day: 10000
      standard:
        requests_per_minute: 30
        queries_per_hour: 200
        tokens_per_day: 100000
      professional:
        requests_per_minute: 100
        queries_per_hour: 1000
        tokens_per_day: 1000000
      enterprise:
        requests_per_minute: 500
        queries_per_hour: 10000
        tokens_per_day: -1
  
  network:
    mtls_enabled: true
    tls_min_version: "TLSv1.3"
    cipher_suites:
      - "TLS_AES_256_GCM_SHA384"
      - "TLS_CHACHA20_POLY1305_SHA256"

# ==========================================
# INGESTION CONFIGURATION (Phase 7)
# ==========================================
ingestion:
  sources:
    india_code:
      base_url: "https://www.indiacode.nic.in"
      document_types: ["LEGISLATION", "RULE"]
      authority_tier: 1
      jurisdiction: "INDIA"
      languages: ["en", "hi"]
      acquisition_method: "api"
      schedule: "0 2 1 * *"  # Monthly 1st at 2 AM
    
    ip_india:
      base_url: "https://ipindia.gov.in"
      document_types: ["LEGISLATION", "RULE", "GUIDELINE", "REGISTRY_RECORD", "JOURNAL"]
      authority_tier: {"act": 1, "rule": 1, "guideline": 2, "registry": 3, "journal": 2}
      jurisdiction: "INDIA"
      languages: ["en"]
      acquisition_method: "playwright"
      schedule: "0 3 * * 0"  # Weekly Sunday 3 AM
    
    nba:
      base_url: "http://nbaindia.org"
      document_types: ["LEGISLATION", "RULE", "GUIDELINE", "NOTIFICATION", "REGISTRY_RECORD"]
      authority_tier: {"act": 1, "rule": 1, "guideline": 2, "notification": 2, "registry": 3}
      jurisdiction: "INDIA"
      languages: ["en"]
      acquisition_method: "playwright"
      schedule: "0 3 * * 1"  # Weekly Monday 3 AM
    
    cbd:
      base_url: "https://www.cbd.int"
      document_types: ["TREATY", "COP_DECISION"]
      authority_tier: 1
      jurisdiction: "INTERNATIONAL"
      languages: ["en", "fr", "es"]
      acquisition_method: "direct_pdf"
      schedule: "0 4 1 */3 *"  # Quarterly
    
    wipo:
      base_url: "https://www.wipo.int"
      document_types: ["TREATY", "PROTOCOL"]
      authority_tier: 1
      jurisdiction: "INTERNATIONAL"
      languages: ["en", "fr", "es"]
      acquisition_method: "direct_pdf"
      schedule: "0 4 1 */3 *"
    
    fssai:
      base_url: "https://www.fssai.gov.in"
      document_types: ["LEGISLATION", "REGULATION", "NOTIFICATION"]
      authority_tier: {"act": 1, "regulation": 2, "notification": 2}
      jurisdiction: "INDIA"
      languages: ["en"]
      acquisition_method: "playwright"
      schedule: "0 5 1 * *"
    
    ayush:
      base_url: "https://www.ayush.gov.in"
      document_types: ["LEGISLATION", "GUIDELINE", "PHARMACOPOEIA", "FORMULARY"]
      authority_tier: {"act": 1, "guideline": 2, "pharmacopoeia": 2, "formulary": 2}
      jurisdiction: "INDIA"
      languages: ["en", "hi"]
      acquisition_method: "mixed"
      schedule: "0 5 1 */3 *"
  
  parsing:
    pdf:
      primary: "pdfplumber"
      ocr_fallback: "tesseract"
      ocr_languages: "eng+hin"
      ocr_dpi: 300
    html:
      parser: "lxml"
      remove_tags: ["nav", "header", "footer", "script", "style", "aside", "noscript"]
  
  chunking:
    max_tokens: 1536
    min_tokens: 128
    overlap_ratio: 0.15
    definition_boost: 2.0
    table_chunk_separately: true
    multilingual_enabled: false
  
  deduplication:
    exact_hash: true
    near_duplicate_threshold: 0.98
  
  validation:
    required_fields: ["source_id", "document_id", "version", "section", "authority_tier", "jurisdiction", "canonical_url", "content_hash"]
    min_extraction_confidence: 0.7

# ==========================================
# RETRIEVAL CONFIGURATION (Phase 10)
# ==========================================
retrieval:
  hybrid:
    vector_weight: 0.6
    lexical_weight: 0.4
    rrf_k: 60
  
  filters:
    default_jurisdiction: "INDIA"
    authority_tier_filter: true
    date_range_filter: true
    source_type_filter: true
  
  caching:
    query_cache_ttl: 300
    embedding_cache_ttl: 86400
    max_cache_size: 10000
  
  scaling:
    max_concurrent_queries: 100
    query_timeout_seconds: 30
    batch_size: 32

# ==========================================
# RAG PIPELINE CONFIGURATION (Phase 9)
# ==========================================
rag:
  pipeline:
    stages:
      - "query_analysis"
      - "jurisdiction_detection"
      - "retrieval"
      - "reranking"
      - "evidence_selection"
      - "citation_verification"
      - "generation"
      - "citation_formatting"
      - "output_validation"
  
  retrieval:
    top_k_initial: 100
    top_k_reranked: 20
    top_k_final: 10
    min_score_threshold: 0.3
  
  generation:
    max_context_tokens: 8000
    citation_style: "legal_standard"
    require_citations: true
    max_claims_per_answer: 10
  
  validation:
    verify_citations: true
    check_jurisdiction_consistency: true
    check_authority_consistency: true
    pii_detection: true

# ==========================================
# EVALUATION CONFIGURATION (Phase 11)
# ==========================================
evaluation:
  benchmarks:
    - "legal_qa_indian"
    - "citation_accuracy"
    - "jurisdiction_accuracy"
    - "authority_weighting"
    - "multilingual_retrieval"
  
  metrics:
    retrieval:
      - "recall@10"
      - "recall@20"
      - "ndcg@10"
      - "mrr"
      - "authority_precision"
    generation:
      - "citation_accuracy"
      - "factual_consistency"
      - "jurisdiction_adherence"
      - "authority_adherence"
      - "answer_completeness"
    system:
      - "latency_p50"
      - "latency_p95"
      - "latency_p99"
      - "throughput_qps"
      - "error_rate"
  
  experiment_tracking:
    backend: "mlflow"
    tracking_uri: "http://localhost:5000"

# ==========================================
# SECURITY CONFIGURATION (Phase 18)
# ==========================================
security:
  jwt:
    algorithm: "RS256"
    issuer: "ip-sakti"
    audience: "ip-sakti-api"
    access_token_ttl: 900
    refresh_token_ttl: 604800
    key_rotation_days: 90
  
  api_keys:
    hash_algorithm: "sha256"
    default_ttl_days: 365
    max_keys_per_user: 10
  
  mfa:
    methods: ["totp", "webauthn"]
    totp_issuer: "IP-SAKTI Sahayak"
    webauthn_rp_id: "ip-sakti.local"
  
  encryption:
    algorithm: "AES-256-GCM"
    kms_backend: "local"
    key_rotation_days: 90
  
  rate_limiting:
    tiers:
      standard:
        requests_per_minute: 60
      premium:
        requests_per_minute: 300
      enterprise:
        requests_per_minute: 1000
  
  network:
    mtls_enabled: true
    tls_min_version: "TLSv1.3"

# ==========================================
# DEPLOYMENT CONFIGURATION (Phase 21)
# ==========================================
deployment:
  environment: "development"
  replicas:
    api: 2
    retrieval: 3
    ingestion: 1
    evaluation: 1
  
  resources:
    api:
      cpu: "500m"
      memory: "1Gi"
    retrieval:
      cpu: "1000m"
      memory: "2Gi"
    ingestion:
      cpu: "2000m"
      memory: "4Gi"
  
  autoscaling:
    enabled: true
    min_replicas: 2
    max_replicas: 10
    target_cpu_utilization: 70

# ==========================================
# OBSERVABILITY CONFIGURATION (Phase 22)
# ==========================================
observability:
  logging:
    level: "INFO"
    format: "json"
    output: "stdout"
  
  metrics:
    prometheus_port: 9090
    export_interval: 30
  
  tracing:
    enabled: true
    sampler_rate: 0.1
    jaeger_endpoint: "http://localhost:14268/api/traces"
  
  alerting:
    rules:
      - name: "high_error_rate"
        condition: "error_rate > 0.05"
        severity: "critical"
      - name: "high_latency"
        condition: "latency_p99 > 10000"
        severity: "warning"
      - name: "low_retrieval_authority"
        condition: "retrieval_binding_ratio < 0.8"
        severity: "warning"